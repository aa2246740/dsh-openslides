# 「演示文稿」DSH 插件挂载补丁 — 使用前先复制一份并改成本机绝对路径：
#   cp scripts/dsh-personal-slides.patch.example.yml my-slides.patch.yml
#
# 注意：name 必须指向构建产物「文件」，写包目录会被按 ESM 目录导入而失败。
#
# 两种情况：
#  A. 已安装 dsh-personal（Personal 入口）→ 演示文稿出现在 Personal 侧栏
#     name 指向你本地 dsh-personal-entry 仓库构建出的 lib/index.js
#     （该仓库内跑过 npm run build 才有 lib/）。
#  B. 不装 dsh-personal → 演示文稿作为独立入口出现在 DSH 主导航
#     把第一段删掉即可（插件 client 会自动切换成顶层入口模式）。
- insert:
    - id: dsh-personal
      name: /ABS/PATH/TO/dsh-personal-entry/lib/index.js
    - id: dsh-personal-slides
      name: /ABS/PATH/TO/dsh-openslides/dsh-personal-slides/lib/dsh-personal-slides.js
